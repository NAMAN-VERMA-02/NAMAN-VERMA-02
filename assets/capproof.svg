<text class="l" x="28" y="152" style="animation-delay:0.81s" xml:space="preserve"><tspan fill="#8b949e">billed     </tspan><tspan fill="#e6edf3">$0.013536 (300.8% of the $0.0045 cap)</tspan></text>
<text class="l" x="28" y="182" style="animation-delay:1.09s" xml:space="preserve"><tspan fill="#8b949e">calls      </tspan><tspan fill="#e6edf3">30 reached the provider; the cap allows 9</tspan></text>
<text class="l" x="28" y="242" style="animation-delay:1.65s" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">capproof run -scenario burst -target </tspan><tspan fill="#58a6ff">strict-gateway</tspan></text>
<text class="l" x="28" y="272" style="animation-delay:1.93s" xml:space="preserve"><tspan fill="#8b949e">verdict    </tspan><tspan fill="#3fb950">HELD</tspan><tspan fill="#8b949e">  exit 0</tspan></text>
<text class="l" x="28" y="302" style="animation-delay:2.21s" xml:space="preserve"><tspan fill="#8b949e">billed     </tspan><tspan fill="#e6edf3">$0.0040608 (90.2% of the cap)</tspan></text>
<text class="l" x="28" y="332" style="animation-delay:2.49s" xml:space="preserve"><tspan fill="#8b949e">responses  </tspan><tspan fill="#e6edf3">9 × 200, 21 × 429 budget_exceeded</tspan></text>
<rect class="cur" x="28" y="344" width="10" height="20" fill="#e6edf3"/>
<text x="696" y="384" fill="#484f58" text-anchor="end" style="font-size:12px">real output, trimmed</text></svg>