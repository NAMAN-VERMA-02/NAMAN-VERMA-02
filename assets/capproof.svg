<text class="l" x="28" y="92" style="animation-delay:0.25s" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">capproof run -scenario burst -target </tspan><tspan fill="#58a6ff">naive-gateway</tspan></text>
