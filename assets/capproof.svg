<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="capproof · spend-cap fault test: real terminal output">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px}.l{opacity:0;animation:in .35s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}</style>
<rect width="720" height="400" rx="14" fill="#0d1117" stroke="#30363d"/>
